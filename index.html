<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Westbury Trivia">
<title>Westbury Family Trivia</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#14161c; --muted:#5b6170; --line:#d5d8e0; --card:#f4f5f8; --acc:#2563eb; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --fg:#f1f2f5; --muted:#a3a9b8; --line:#353a47; --card:#1d2029; --acc:#60a5fa; --ok:#4ade80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, system-ui, sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:620px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:26px; margin:0; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  button { font:inherit; font-size:20px; font-weight:600; min-height:58px; padding:12px 18px; border-radius:16px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.wide { width:100%; }
  button.chip { border-radius:999px; min-height:48px; border-width:2px; font-size:18px; }
  button.chip.on { border-color:var(--acc); }
  button.chip:not(.on) { color:var(--muted); }
  button:disabled { opacity:.4; text-decoration:line-through; }
  button.choice { width:100%; text-align:left; display:flex; gap:12px; align-items:center; }
  button.choice.toddler { font-size:28px; min-height:80px; justify-content:center; text-align:center; }
  .letter { color:var(--muted); font-size:18px; }
  .q { font-size:28px; line-height:1.3; font-weight:700; margin:0; }
  .who { font-size:22px; font-weight:700; }
  .tag { font-size:14px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .muted { color:var(--muted); font-size:16px; margin:0; line-height:1.4; }
  .label { font-weight:600; color:var(--muted); font-size:16px; margin:4px 0 0; }
  .note { font-size:17px; margin:0; }
  .box { border:2px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:8px; }
  .box.ok { border-color:var(--ok); }
  .big { font-size:30px; font-weight:700; }
  .ok .big { color:var(--ok); }
  .score { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:16px; }
  .score.cur { border-color:var(--acc); border-width:2px; }
  .sumrow { display:flex; align-items:center; gap:12px; padding:12px 16px; border:1px solid var(--line); border-radius:12px; font-size:22px; }
  .sumrow b { margin-left:auto; font-size:26px; }
  .loading { padding:40px 0; text-align:center; font-size:20px; }
</style>
</head>
<body>
<main id="app"><div class="loading">Loading questions…</div></main>
<script>
const THEME_LABEL = { animals:"Animals", disney:"Disney & movies", math:"Numbers & math", science:"Science", space:"Space", geography:"Geography", idaho:"Idaho & Boise", holidays:"Holidays", food:"Food", body:"Human body", words:"Words & spelling", history:"History", sports:"Sports", music:"Music", colors:"Colors", shapes:"Shapes", nature:"Nature & weather", vehicles:"Vehicles", dinosaurs:"Dinosaurs", tv:"TV", tech:"Tech & games" };
const TIER_LABEL = { toddler:"Age 3", kid6:"Age 6", kid8:"Age 8–9", adult:"Grown-up" };
let DATA, PLAYERS, TIER, BANK = {}, THEMES = [];
const LS_KEY = "wbt_history_v2", LS_SET = "wbt_settings_v2";

// ---------- audio (one reused element; unlocked by the first tap) ----------
const player = new Audio(); player.preload = "auto"; player.setAttribute("playsinline", "");
const SILENCE = "data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjcuMTAzAAAAAAAAAAAAAAD/84TAAAAAAAAAAAAASW5mbwAAAA8AAAAHAAADYABVVVVVVVVVVVVVVVVVVXFxcXFxcXFxcXFxcXFxjo6Ojo6Ojo6Ojo6Ojo6qqqqqqqqqqqqqqqqqqqrHx8fHx8fHx8fHx8fHx+Pj4+Pj4+Pj4+Pj4+Pj//////////////////8AAAAATGF2YzYxLjE5AAAAAAAAAAAAAAAAJAQgAAAAAAAAA2CZUOnQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/80TEAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy7/80TEUwAAA0gAAAAAMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy7/80TEpgAAA0gAAAAAMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy7/80TErAAAA0gAAAAAMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy7/80TErAAAA0gAAAAAMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80TErAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80TErAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=";
let unlocked = false;
function unlock() {
  if (unlocked) return; unlocked = true;
  try { player.src = SILENCE; const p = player.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
const A = k => "audio/" + k + ".mp3";
const warmed = new Set();
function preload(keys) { keys.forEach(k => { if (!k || warmed.has(k)) return; warmed.add(k); fetch(A(k)).catch(() => warmed.delete(k)); }); }
let seqId = 0;
function speakFallback(text, done) {
  try { const s = window.speechSynthesis; if (!s || !text) { done(); return; }
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.9; u.onend = done; u.onerror = done; s.speak(u);
  } catch (e) { done(); }
}
function play(keys, onDone) {
  const id = ++seqId; let i = 0;
  try { player.pause(); } catch (e) {}
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
  const next = () => {
    if (id !== seqId) return;
    if (i >= keys.length) { onDone && onDone(); return; }
    const key = keys[i++]; if (!key) { next(); return; }
    let done = false; const go = () => { if (done) return; done = true; if (id === seqId) setTimeout(next, 80); };
    const fail = () => { if (done) return; done = true; if (id === seqId) speakFallback(DATA.text[key] || "", next); };
    player.onended = go; player.onerror = fail;
    player.src = A(key);
    const p = player.play(); if (p && p.catch) p.catch(fail);
  };
  next();
}
function stopAudio() { seqId++; try { player.pause(); } catch (e) {} try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} }
const rnd = n => Math.floor(Math.random() * n);
const fx = (name, player) => player ? `${name}_${player}_${rnd(DATA.fx[name])}` : `${name}_${rnd(DATA.fx[name])}`;

// ---------- answer matching (mic) ----------
const NUMS = {zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12",twenty:"20",fifty:"50",hundred:"100",thousand:"1000",first:"1",fourth:"4"};
function norm(s) { return s.toLowerCase().replace(/(\d),(\d)/g, "$1$2").replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w && !["a","an","the","is","it","its"].includes(w)).map(w => NUMS[w] || w).join(" "); }
function has(hay, needle) { const n = norm(needle); return !!n && (" " + norm(hay) + " ").includes(" " + n + " "); }
function judge(alts, q) {
  const good = [q.choices[q.correct], ...q.accepted], bad = q.choices.filter((_, i) => i !== q.correct);
  let r = false, w = false;
  alts.forEach(a => { if (good.some(g => has(a, g))) r = true; if (bad.some(b => has(a, b) && !good.some(g => has(b, g)))) w = true; });
  return r && !w ? "right" : w && !r ? "wrong" : "unsure";
}
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition || null;

// ---------- history (localStorage) ----------
let HIST = {}; try { HIST = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { HIST = {}; }
function saveHist() { try { localStorage.setItem(LS_KEY, JSON.stringify(HIST)); } catch (e) {} }
function remember(tier, id) {
  const h = (HIST[tier] = (HIST[tier] || []).filter(x => x !== id)); h.push(id);
  const cap = Math.floor(BANK[tier].length * 0.8); while (h.length > cap) h.shift(); saveHist();
}

// ---------- state ----------
let SET = {}; try { SET = JSON.parse(localStorage.getItem(LS_SET) || "{}"); } catch (e) {}
const S = { phase: "setup", selected: [], theme: SET.theme || "all", order: [], turn: 0, round: 1, scores: {}, cur: null, hintUsed: false, crossed: [], lastRight: false, listening: false, note: "", micOff: !Rec, used: new Set(), feedbackKey: null };
let rec = null, recTimer = null;

function poolFor(name, theme) {
  const tier = TIER[name], all = BANK[tier];
  return theme === "all" ? all : all.filter(q => q.theme === theme);
}
function pick(name) {
  const tier = TIER[name]; let pool = poolFor(name, S.theme), fellBack = false;
  if (!pool.length) { pool = BANK[tier]; fellBack = true; }
  const recent = new Set(HIST[tier] || []);
  let c = pool.filter(q => !S.used.has(q.id) && !recent.has(q.id));
  if (!c.length) c = pool.filter(q => !S.used.has(q.id));
  if (!c.length) { pool.forEach(q => S.used.delete(q.id)); c = pool.slice(); }
  const q = c[rnd(c.length)]; S.used.add(q.id); remember(tier, q.id); return { q, fellBack };
}
function qKeys(c) { return [c.intro, "q_" + c.q.id]; }
function prepNext() {
  // pick the next player's question ahead of time and warm its audio
  const nextIdx = S.turn + 1 < S.order.length ? S.turn + 1 : 0;
  const name = S.order[nextIdx]; const p = pick(name);
  S.queued = { player: name, q: p.q, fellBack: p.fellBack, intro: fx("intro", name) };
  const q = p.q; preload([S.queued.intro, "q_" + q.id, "a_" + q.id, "f_" + q.id, q.hint ? "h_" + q.id : null]);
}
function showTurn() {
  stopListening(); const name = S.order[S.turn];
  if (S.queued && S.queued.player === name) { S.cur = S.queued; } else { const p = pick(name); S.cur = { player: name, q: p.q, fellBack: p.fellBack, intro: fx("intro", name) }; }
  S.queued = null; S.hintUsed = false; S.crossed = []; S.note = ""; S.phase = "question";
  render(); play(qKeys(S.cur), () => {});
  const q = S.cur.q; preload(["a_" + q.id, "f_" + q.id, q.hint ? "h_" + q.id : null]);
  setTimeout(prepNext, 400);
}
function start() {
  unlock();
  S.order = PLAYERS.filter(n => S.selected.includes(n)); if (!S.order.length) return;
  try { localStorage.setItem(LS_SET, JSON.stringify({ theme: S.theme })); } catch (e) {}
  S.scores = {}; S.order.forEach(n => { S.scores[n] = 0; }); S.turn = 0; S.round = 1; S.queued = null; showTurn();
}
function finish(right) {
  stopListening(); const c = S.cur; S.lastRight = right; if (right) S.scores[c.player]++;
  S.phase = "feedback"; S.feedbackKeys = right ? [fx("right", c.player), "f_" + c.q.id] : [fx("wrong", c.player), "a_" + c.q.id, "f_" + c.q.id];
  render(); play(S.feedbackKeys);
}
function answer(i) {
  unlock(); const c = S.cur; if (i === c.q.correct) { finish(true); return; }
  const kid = TIER[c.player] !== "adult";
  if (kid && !S.hintUsed && c.q.hint) {
    S.hintUsed = true; if (i >= 0) S.crossed.push(i); S.note = ""; stopListening(); render();
    play([fx("hintin"), "h_" + c.q.id, fx("tryagain")]); return;
  }
  finish(false);
}
function hint() { if (S.hintUsed) return; S.hintUsed = true; render(); play(["hintword", "h_" + S.cur.q.id]); }
function next() {
  if (S.turn + 1 >= S.order.length) { stopListening(); S.phase = "summary"; render(); play([fx("roundend")]); return; }
  S.turn++; showTurn();
}
function anotherRound() { S.round++; S.turn = 0; showTurn(); }
function stopListening() {
  if (recTimer) { clearTimeout(recTimer); recTimer = null; }
  if (rec) { try { rec.abort(); } catch (e) {} rec = null; }
  S.listening = false;
}
function listen() {
  if (!Rec) { S.micOff = true; render(); return; }
  stopAudio(); stopListening();
  try {
    rec = new Rec(); rec.lang = "en-US"; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 4;
    rec.onresult = e => {
      const alts = []; for (let i = 0; i < e.results.length; i++) for (let j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript);
      stopListening(); if (!alts.length) { render(); return; }
      const v = judge(alts, S.cur.q);
      if (v === "right") { finish(true); return; }
      if (v === "wrong") { const bi = S.cur.q.choices.findIndex((b, i) => i !== S.cur.q.correct && alts.some(a => has(a, b))); answer(bi); return; }
      S.note = 'I heard "' + alts[0] + '". Tap the answer you said.'; render(); play(["unsure"]);
    };
    rec.onerror = e => {
      stopListening();
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) { S.micOff = true; S.note = "The mic isn't available. Tap the answer you said."; }
      else if (e.error === "no-speech") S.note = "I didn't hear anything. Try again, or tap the answer.";
      else if (e.error !== "aborted") S.note = "Listening didn't work that time. Tap the answer you said.";
      render();
    };
    rec.onend = () => { if (S.listening) { S.listening = false; render(); } };
    rec.start(); S.listening = true; S.note = "Listening… say your answer!"; render();
    recTimer = setTimeout(() => { try { rec && rec.stop(); } catch (e) {} }, 8000);
  } catch (e) { stopListening(); S.micOff = true; S.note = "The mic isn't available. Tap the answer you said."; render(); }
}

// ---------- render ----------
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); Object.entries(attrs || {}).forEach(([k, v]) => { if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (k === "class") n.className = v; else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v); }); kids.flat().forEach(k => { if (k != null && k !== false) n.append(k.nodeType ? k : String(k)); }); return n; };
function themeCount(theme) {
  const tiers = [...new Set(S.selected.map(n => TIER[n]))];
  return tiers.reduce((s, t) => s + (theme === "all" ? BANK[t].length : BANK[t].filter(q => q.theme === theme).length), 0);
}
function render() {
  const app = document.getElementById("app"); app.innerHTML = "";
  app.append(el("div", { class: "row", style: "justify-content:space-between;align-items:center" }, el("h1", {}, "Westbury Family Trivia"),
    S.phase !== "setup" ? el("button", { style: "min-height:44px;font-size:16px", onclick: () => { stopListening(); stopAudio(); S.phase = "setup"; render(); } }, "Players") : null));
  if (S.phase === "setup") {
    const avail = THEMES.filter(t => S.selected.length && themeCount(t) > 0);
    app.append(el("p", { class: "muted" }, "Turn the volume up and the ringer switch on. The game talks out loud."),
      el("p", { class: "label" }, "Who's playing?"),
      el("div", { class: "row" }, PLAYERS.map(n => el("button", { class: "chip" + (S.selected.includes(n) ? " on" : ""), onclick: () => { S.selected = S.selected.includes(n) ? S.selected.filter(x => x !== n) : [...S.selected, n]; render(); } }, n))),
      el("p", { class: "label" }, "Theme"),
      el("div", { class: "row" }, ["all", ...avail].map(t => el("button", { class: "chip" + (S.theme === t ? " on" : ""), onclick: () => { S.theme = t; render(); } }, t === "all" ? "All" : THEME_LABEL[t] || t))),
      S.theme !== "all" && S.selected.some(n => !BANK[TIER[n]].some(q => q.theme === S.theme)) ? el("p", { class: "muted" }, "Some players don't have " + (THEME_LABEL[S.theme] || S.theme) + " questions at their level, so they'll get All.") : "",
      el("button", { class: "primary wide", disabled: !S.selected.length, onclick: start }, S.selected.length ? "Start" : "Pick who's playing"),
      el("button", { class: "wide", onclick: () => { unlock(); play(["test"]); } }, "Test sound"),
      el("p", { class: "muted" }, DATA.q.length + " questions: " + Object.keys(TIER_LABEL).map(t => TIER_LABEL[t] + " " + BANK[t].length).join(", ") + "."));
    return;
  }
  if (S.phase === "summary") {
    app.append(el("div", { class: "big" }, "Round " + S.round + " done!"),
      ...S.order.map(n => el("div", { class: "sumrow" }, n, el("b", {}, S.scores[n]))),
      el("p", { class: "muted" }, "Great playing, everybody! Every try counts."),
      el("button", { class: "primary wide", onclick: () => { unlock(); anotherRound(); } }, "Another round"));
    return;
  }
  const c = S.cur, kid = TIER[c.player] !== "adult", tod = TIER[c.player] === "toddler";
  app.append(el("div", { class: "row" }, S.order.map(n => el("div", { class: "score" + (n === c.player ? " cur" : "") }, n, el("b", {}, S.scores[n])))),
    el("div", {}, el("div", { class: "who" }, c.player + "'s turn"), el("div", { class: "tag" }, (THEME_LABEL[c.q.theme] || c.q.theme) + (c.fellBack ? " (mixed)" : ""))),
    el("p", { class: "q" }, c.q.text));
  if (S.phase === "question") {
    app.append(el("button", { class: "wide", onclick: () => { unlock(); play(qKeys(c)); } }, "Hear it again"));
    if (!S.micOff) app.append(el("button", { class: "primary wide", style: "min-height:72px;font-size:22px", onclick: () => S.listening ? (stopListening(), render()) : listen() }, S.listening ? "Listening… tap to stop" : "Answer out loud"));
    if (S.note) app.append(el("p", { class: "note" }, S.note)); else if (S.micOff) app.append(el("p", { class: "muted" }, "Tap the answer you said."));
    app.append(...c.q.choices.map((ch, i) => el("button", { class: "choice" + (tod ? " toddler" : ""), disabled: S.crossed.includes(i), onclick: () => answer(i) }, tod ? null : el("span", { class: "letter" }, "ABCD"[i]), ch)));
    app.append(el("div", { class: "row" },
      kid && c.q.hint && !S.hintUsed ? el("button", { style: "flex:1 1 140px", onclick: () => { unlock(); hint(); } }, "Hint") : null,
      el("button", { style: "flex:1 1 140px;font-size:17px", onclick: () => { unlock(); finish(false); } }, "Show answer")));
    if (kid && S.hintUsed && c.q.hint) app.append(el("p", { class: "note" }, "Hint: " + c.q.hint));
  } else {
    app.append(el("div", { class: "box" + (S.lastRight ? " ok" : "") },
      el("span", { class: "big" }, (S.lastRight ? "You got it, " : "Nice try, ") + c.player + "!"),
      S.lastRight ? null : el("span", { style: "font-size:22px" }, "The answer is " + c.q.choices[c.q.correct] + "."),
      el("span", { class: "muted", style: "font-size:18px" }, c.q.fact)),
      el("button", { class: "primary wide", style: "min-height:68px", onclick: () => { unlock(); next(); } }, S.turn + 1 >= S.order.length ? "See the scores" : "Next: " + S.order[S.turn + 1]),
      el("button", { class: "wide", onclick: () => { unlock(); play(S.feedbackKeys); } }, "Hear it again"));
  }
}
fetch("questions.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  DATA = d; PLAYERS = d.names; TIER = d.tier; S.selected = [];
  d.q.forEach(q => { (BANK[q.tier] = BANK[q.tier] || []).push(q); });
  THEMES = Object.keys(THEME_LABEL).filter(t => d.q.some(q => q.theme === t));
  if (S.theme !== "all" && !THEMES.includes(S.theme)) S.theme = "all";
  render();
}).catch(() => { document.getElementById("app").innerHTML = '<div class="loading">Couldn\'t load the questions. Check your connection and reload.</div>'; });
</script>
</body>
</html>
